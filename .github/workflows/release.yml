# A tag v<N> builds the patched Fast DDS packages for every release in
# distros.env on amd64 and arm64 (native runners), proves on each architecture
# that the stock package fails each reproducer (a closed world, a split world, a
# wedged sender) and the patched one passes all three, and only then publishes
# one GitHub release carrying every .deb and a SHA256SUMS file. The split is a
# race: a stock round splits about one time in three, so the stock run stops at
# its first split and allows up to 48 rounds; the patched run must stay whole
# in all of its 8 (repro/split_world.sh has the numbers).
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        distro: [humble, jazzy, lyrical]
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the patched package
        run: ./build.sh ${{ matrix.distro }} out
      - name: The stock package closes the world
        run: repro/closed_world.sh ${{ matrix.distro }}
      - name: The patched package keeps it open
        run: repro/closed_world.sh ${{ matrix.distro }} out/*.deb
      - name: The stock package splits the world (port mutex reset; first split of up to 48 rounds)
        run: repro/split_world.sh ${{ matrix.distro }}
      - name: The patched package keeps it whole (8 of 8 rounds)
        run: repro/split_world.sh ${{ matrix.distro }} out/*.deb
      - name: The stock package wedges a sender (recover loop)
        run: repro/blocked_sender.sh ${{ matrix.distro }}
      - name: The patched package recovers it
        run: repro/blocked_sender.sh ${{ matrix.distro }} out/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.distro }}-${{ matrix.runner }}
          path: out/*.deb
          if-no-files-found: error
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          # Stable asset names (no version, no "+"): <package>-<distro>-<arch>.deb,
          # e.g. fastrtps-jazzy-arm64.deb; the full version is inside the package
          # and in VERSIONS.
          : > VERSIONS
          for f in ros-*.deb; do
            pkg=$(dpkg-deb -f "$f" Package); arch=$(dpkg-deb -f "$f" Architecture)
            distro=$(echo "$pkg" | cut -d- -f2); name="${pkg#ros-*-}-${distro}-${arch}.deb"
            echo "$name $pkg $(dpkg-deb -f "$f" Version)" >> VERSIONS
            mv "$f" "$name"
          done
          sha256sum ./*.deb | sed 's| \./| |' > SHA256SUMS
          cat VERSIONS
          cat SHA256SUMS
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" --notes-file ../RELEASE_NOTES.md ./*.deb SHA256SUMS VERSIONS
